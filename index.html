<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Primer Viaje a la Playa ❤️</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@200;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Tipografías Personalizadas */
        .font-romantic {
            font-family: 'Dancing Script', cursive;
        }
        .font-modern {
            font-family: 'Montserrat', sans-serif;
        }

        /* Fondo y ambiente */
        body {
            background-color: #0a0f1a;
            /* Imagen de fondo de una playa nocturna con estrellas oscura */
            background-image: linear-gradient(rgba(0, 0, 5, 0.6), rgba(0, 0, 20, 0.7)), url('https://images.unsplash.com/photo-1505228395891-9a51e7e86bf6?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            overflow: hidden; /* Para evitar scroll por los corazones flotantes */
        }

        /* Efecto Glassmorphism */
        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        /* Estilos de los números de la cuenta regresiva */
        .time-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .time-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
            border-color: rgba(236, 72, 153, 0.4);
        }

        .number-glow {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.5), 0 0 30px rgba(236, 72, 153, 0.5);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Corazones Flotantes */
        .heart {
            position: absolute;
            bottom: -100px;
            font-size: 1.5rem;
            color: rgba(255, 105, 180, 0.6);
            animation: floatUp 10s linear infinite;
            z-index: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.5));
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Destello suave del texto romántico */
        .text-pulse {
            animation: pulseGlow 3s infinite alternate;
        }
        
        @keyframes pulseGlow {
            from { text-shadow: 0 0 10px rgba(255, 255, 255, 0.6); }
            to { text-shadow: 0 0 25px rgba(255, 182, 193, 1); }
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center font-modern text-white relative">

    <!-- Contenedor de corazones generados dinámicamente por JS -->
    <div id="hearts-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

    <!-- Contenedor Principal (Glassmorphism) -->
    <main class="glass-container w-11/12 max-w-4xl rounded-3xl p-8 md:p-12 relative z-10 flex flex-col items-center text-center">
        
        <!-- Título Romántico -->
        <h1 class="font-romantic text-4xl md:text-6xl lg:text-7xl mb-8 leading-tight text-pulse">
            Nos vamos a nuestro primer <br>
            <span class="text-pink-300">viaje a la playita</span> juntos ❤️
        </h1>

        <!-- Mensaje de motivación -->
        <p class="text-gray-300 mb-10 text-sm md:text-base tracking-widest uppercase font-light">
            La espera casi termina, mi amor...
        </p>

        <!-- Grilla de Cuenta Regresiva -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 w-full max-w-3xl mb-12">
            <!-- Días -->
            <div class="time-box rounded-2xl p-4 md:p-6 flex flex-col items-center justify-center">
                <span id="days" class="text-5xl md:text-7xl font-bold number-glow mb-2 text-white">00</span>
                <span class="text-xs md:text-sm tracking-[0.2em] text-pink-200 uppercase">Días</span>
            </div>
            
            <!-- Horas -->
            <div class="time-box rounded-2xl p-4 md:p-6 flex flex-col items-center justify-center">
                <span id="hours" class="text-5xl md:text-7xl font-bold number-glow mb-2 text-white">00</span>
                <span class="text-xs md:text-sm tracking-[0.2em] text-pink-200 uppercase">Horas</span>
            </div>
            
            <!-- Minutos -->
            <div class="time-box rounded-2xl p-4 md:p-6 flex flex-col items-center justify-center">
                <span id="minutes" class="text-5xl md:text-7xl font-bold number-glow mb-2 text-white">00</span>
                <span class="text-xs md:text-sm tracking-[0.2em] text-pink-200 uppercase">Minutos</span>
            </div>
            
            <!-- Segundos -->
            <div class="time-box rounded-2xl p-4 md:p-6 flex flex-col items-center justify-center">
                <span id="seconds" class="text-5xl md:text-7xl font-bold number-glow mb-2 text-white">00</span>
                <span class="text-xs md:text-sm tracking-[0.2em] text-pink-200 uppercase">Segundos</span>
            </div>
        </div>

        <!-- Pie de página romántico -->
        <div class="mt-4 border-t border-white/20 pt-6 w-full max-w-lg">
            <p class="font-romantic text-2xl md:text-3xl text-pink-100">
                Para mi hermosa Atziri, de Jonathan.
            </p>
        </div>

    </main>

    <script>
        // --- LÓGICA DE LA CUENTA REGRESIVA ---
        // Fecha objetivo: Jueves 5 de Noviembre de 2026 a las 06:00 AM
        const targetDate = new Date("Nov 5, 2026 06:00:00").getTime();

        const updateCountdown = () => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            // Cálculos de tiempo
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Mostrar en el DOM con formato de 2 dígitos
            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');

            // Si la cuenta regresiva termina
            if (distance < 0) {
                clearInterval(interval);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                
                // Cambiar el título al llegar el momento
                document.querySelector("h1").innerHTML = "¡Es hora de nuestro <span class='text-pink-300'>viaje a la playita!</span> ❤️";
                document.querySelector("p.uppercase").innerText = "¡A disfrutar mi amor!";
            }
        };

        // Iniciar la cuenta regresiva
        updateCountdown();
        const interval = setInterval(updateCountdown, 1000);


        // --- LÓGICA DE ANIMACIÓN DE CORAZONES ---
        const heartsContainer = document.getElementById("hearts-container");
        const heartSymbols = ["❤️", "💖", "✨", "💕"];

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            
            // Elegir un símbolo aleatorio
            heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            
            // Posición horizontal aleatoria (0% a 100% de la pantalla)
            heart.style.left = Math.random() * 100 + "vw";
            
            // Tamaño aleatorio para dar profundidad
            heart.style.fontSize = (Math.random() * 1.5 + 0.8) + "rem";
            
            // Duración de animación aleatoria para que no suban al mismo tiempo
            heart.style.animationDuration = (Math.random() * 8 + 6) + "s";
            
            // Opacidad base aleatoria
            heart.style.opacity = Math.random() * 0.5 + 0.3;

            heartsContainer.appendChild(heart);

            // Eliminar el corazón del DOM una vez que termina la animación para no consumir memoria
            setTimeout(() => {
                heart.remove();
            }, 14000); 
        }

        // Crear corazones continuamente
        setInterval(createHeart, 600); // Genera un corazón nuevo cada 0.6 segundos
    </script>
</body>
</html>
